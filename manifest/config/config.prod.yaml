# Enterprise Agent 生产环境配置
# 敏感字段（密钥、密码）应通过环境变量注入，切勿硬编码

app:
  env: prod
  debug: false

server:
  read_timeout: 60s
  write_timeout: 60s

auth:
  secret_key: "${JWT_SECRET_KEY}"   # 通过环境变量注入
  token_ttl: 3600
  refresh_ttl: 86400

elasticsearch:
  addresses:
    - "https://prod-es.internal:9200"
  username: "elastic"
  password: "${ES_PASSWORD}"

weaviate:
  scheme: "https"
  host: "${WEAVIATE_HOST}"
  api_key: "${WEAVIATE_API_KEY}"

redis:
  addr: "${REDIS_ADDR}"
  password: "${REDIS_PASSWORD}"
  pool_size: 50

ai:
  openai:
    api_key: "${OPENAI_API_KEY}"
    model: "gpt-4o"
    temperature: 0.5
    max_tokens: 4096

log:
  level: "warn"
  format: "json"
  output: "file"
  file_path: "/var/log/enterprise-agent/app.log"
  max_size: 500
  max_backups: 30
  max_age: 90
