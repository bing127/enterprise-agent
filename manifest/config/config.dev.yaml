# Enterprise Agent 开发环境配置（完整配置）

app:
  name: enterprise-agent
  env: dev
  port: 8080
  debug: true

server:
  host: "0.0.0.0"
  port: 8080
  read_timeout: 30s
  write_timeout: 30s
  max_request_body_size: 10485760  # 10 MB

auth:
  secret_key: "change-me-in-production"
  token_ttl: 7200
  refresh_ttl: 604800

elasticsearch:
  addresses:
    - "http://dev-es.internal:9200"
  username: "elastic"
  password: "dev-password"
  index_prefix: "enterprise-agent"

weaviate:
  scheme: "http"
  host: "dev-weaviate.internal:8088"
  grpc_port: 50051
  api_key: ""

redis:
  addr: "dev-redis.internal:6379"
  password: "dev-password"
  db: 0
  pool_size: 10
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s

ai:
  provider: "openai"
  openai:
    api_key: "${OPENAI_API_KEY}"
    base_url: "https://api.openai.com/v1"
    model: "gpt-4o-mini"
    temperature: 0.7
    max_tokens: 2048
  ark:
    api_key: ""
    endpoint_id: ""
    region: "cn-beijing"
  qwen:
    api_key: ""
    model: "qwen-max"

log:
  level: "debug"
  format: "text"
  output: "both"
  file_path: "./resource/logs/app.log"
  max_size: 100
  max_backups: 7
  max_age: 30
